services:
  db:
    container_name: imgproc-db
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imgproc}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: imgproc-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

  app:
    container_name: imgproc-api
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-imgproc}:${POSTGRES_PASSWORD:-imgproc}@db:5432/${POSTGRES_DB:-imgproc}
    ports:
      - '8000:8000'
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  
  worker:
    container_name: imgproc-worker
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-imgproc}:${POSTGRES_PASSWORD:-imgproc}@db:5432/${POSTGRES_DB:-imgproc}
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A core.celery_app worker --loglevel=info --pool=solo

volumes:
  pgdata: